name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web Studio
        run: |
          cd web
          npm ci || npm install
          npm run build

      - name: Run Go Unit Tests
        run: go test -v ./...

      - name: Build queryproof Binary
        run: go build -v -o bin/queryproof ./cmd/queryproof

      - name: Run Falsification Audits
        run: ./bin/queryproof audit -f examples/failing_queries -c examples/catalog.json -m examples/metrics.yaml
